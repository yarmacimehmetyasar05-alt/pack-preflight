name: beta-binaries

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    name: build-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            binary: dist/pack-preflight
          - os: windows-latest
            label: windows
            binary: dist/pack-preflight.exe
          - os: ubuntu-latest
            label: linux
            binary: dist/pack-preflight
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyinstaller>=6,<7"

      - name: Run tests
        run: pytest -q

      - name: Build one-file executable
        run: pyinstaller --clean --onefile --name pack-preflight --paths src pack_preflight_entry.py

      - name: Smoke-test executable
        run: python -c "import subprocess; subprocess.run([r'${{ matrix.binary }}', '--help'], check=True)"

      - name: Upload beta executable
        uses: actions/upload-artifact@v4
        with:
          name: pack-preflight-${{ matrix.label }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
