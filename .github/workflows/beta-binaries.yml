name: beta-binaries

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            binary: dist/pack-preflight
          - os: windows-latest
            label: windows
            binary: dist/pack-preflight.exe
          - os: ubuntu-latest
            label: linux
            binary: dist/pack-preflight
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "pyinstaller>=6,<7"

      - name: Run tests
        run: pytest -q

      - name: Build one-file executable
        run: pyinstaller --clean --onefile --name pack-preflight --paths src pack_preflight_entry.py

      - name: Smoke-test executable
        run: |
          python -c "import subprocess; subprocess.run([r'${{ matrix.binary }}', '--help'], check=True)"
          python -c "import subprocess; subprocess.run([r'${{ matrix.binary }}', '--version'], check=True)"

      - name: Package beta executable
        run: python -c "import pathlib, zipfile; p=pathlib.Path(r'${{ matrix.binary }}'); z=pathlib.Path('dist/pack-preflight-${{ matrix.label }}.zip'); f=zipfile.ZipFile(z, 'w', zipfile.ZIP_DEFLATED); f.write(p, arcname=p.name); f.close()"

      - name: Upload beta archive
        uses: actions/upload-artifact@v4
        with:
          name: pack-preflight-${{ matrix.label }}
          path: dist/pack-preflight-${{ matrix.label }}.zip
          if-no-files-found: error

  release:
    name: publish-beta-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.1.0-beta.3

    steps:
      - uses: actions/checkout@v5

      - name: Download packaged binaries
        uses: actions/download-artifact@v5
        with:
          pattern: pack-preflight-*
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease once
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving published assets unchanged."
            exit 0
          fi

          gh release create "$TAG" release-assets/*.zip \
            --target "$GITHUB_SHA" \
            --title "pack-preflight v0.1.0 beta 3" \
            --prerelease \
            --notes-file docs/releases/v0.1.0-beta.3.md
